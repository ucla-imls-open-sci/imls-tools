[project]
name = "carpentries-workbench-checker"
description = "Fast local checks for Carpentries Workbench lessons, with an optional AI review"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
authors = [{ name = "Tim Dennis", email = "tdennis@library.ucla.edu" }]
dynamic = ["version"]
dependencies = [
    "pyyaml>=6",
    "rich>=14",
    "typer>=0.16",
]

[project.optional-dependencies]
# The --ai / `wbcheck review` path. The mechanical checks never import these.
ai = [
    "anthropic>=0.125",
    "langchain>=1.3",
    "langchain-community>=0.4",
    "langchain-ollama>=1.1",
    "langchain-chroma>=1.1",
    "chromadb>=1.5",
    "tiktoken>=0.14",
]

[project.scripts]
wbcheck = "checker.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "checker/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["checker"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120  # existing hint/error strings are prose, not code; 88 would
                    # force ugly mid-sentence wraps for no real readability gain
extend-exclude = ["legacy/"]  # unrelated exploratory notebook, not part of the checker package

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports/vars, undefined names, ...)
    "I",    # isort (import order/grouping)
    "UP",   # pyupgrade (drop needless legacy-Python patterns)
    "D1",   # pydocstyle: missing docstrings on public modules/classes/functions
]
ignore = [
    "D107",  # __init__ docstring -- this codebase has no classes needing one
]

[tool.ruff.lint.per-file-ignores]
# pytest convention: the test name documents intent, a docstring on every
# test_* function is noise, not signal.
"tests/*.py" = ["D1"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
